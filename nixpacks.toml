[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer', 'nodejs_20']

[phases.build]
cmds = [
  'composer install --no-dev --optimize-autoloader',
  'npm install',
  'npm run build'
]

[start]
# 1. make sure the SQLite file exists
# 2. back it up before migrations touch it (skipped when the file is still empty)
# 3. migrate + seed, start the scheduler (daily backups) in the background, then serve
cmd = 'DB_FILE="${DB_DATABASE:-database/database.sqlite}"; touch "$DB_FILE" && php artisan view:clear && { [ ! -s "$DB_FILE" ] || php artisan db:backup --reason=predeploy || echo "WARNING: pre-deploy backup failed"; } && php artisan migrate --force && php artisan db:seed --force && { php artisan schedule:work & } && php artisan serve --host=0.0.0.0 --port=$PORT'
